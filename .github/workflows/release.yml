name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python invoice_dl.py --selftest
      - run: python -c "import tkinter, tkcalendar, googleapiclient.discovery, google_auth_oauthlib.flow"
      # babel.numbers is loaded dynamically by tkcalendar, PyInstaller misses it without the hint
      - run: pyinstaller --onefile --windowed --name InvoiceDownloader --hidden-import babel.numbers invoice_dl.py
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceDownloader
          path: dist/InvoiceDownloader.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/InvoiceDownloader.exe
